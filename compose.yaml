services:
  mcp-hub:
    # Published for every release; `docker compose up --build` builds the same image from source.
    image: ghcr.io/lubos-svoboda/mcp-hub:${MCP_HUB_VERSION:-latest}
    build: .
    container_name: mcp-hub
    restart: unless-stopped
    # Published on the loopback interface only: the server has no authentication.
    ports:
      - "127.0.0.1:8282:8282"
    env_file:
      - ${MCP_HUB_CONFIG:?set MCP_HUB_CONFIG to your configuration directory, see README}/secrets.env
    # Docker Desktop defines host.docker.internal on its own; Docker Engine on Linux needs this line
    # before a container can reach a database running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MCP_HUB_CONFIG}:/config:ro

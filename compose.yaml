services:
  mcp-hub:
    build: .
    image: mcp-hub:0.0.1
    container_name: mcp-hub
    restart: unless-stopped
    # Published on the loopback interface only: the server has no authentication.
    ports:
      - "127.0.0.1:8282:8282"
    env_file:
      - ${MCP_HUB_CONFIG:?set MCP_HUB_CONFIG to your configuration directory, see README}/secrets.env
    # Docker Desktop defines host.docker.internal on its own; Docker Engine on Linux needs this line
    # before a container can reach a database running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Inside the container the server must listen on every interface, otherwise the
      # published port reaches nothing. Only the host binding above limits access.
      SERVER_ADDRESS: "0.0.0.0"
      # A file rather than a directory: a directory that cannot be read would be skipped silently,
      # leaving a server with no environments, while a missing file stops the start with an error.
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/config/application.yaml"
    volumes:
      - ${MCP_HUB_CONFIG}:/config:ro

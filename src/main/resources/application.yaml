server:
  address: 127.0.0.1
  port: 8282

spring:
  application:
    name: mcphub
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: mcp-hub
        # Filled in from the Gradle project version when resources are processed.
        version: "@version@"
        type: SYNC

# Defaults for probing, query limits and pool sizing live in HubProperties.kt and are
# not repeated here. Override them under mcp-hub.defaults, or per environment.
#
# Environments carry credentials and are therefore never defined in this file. Supply
# them from an external configuration file or from environment variables.
